<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google ADK Agent - Cloud Run & Cloud SQL Memory</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #475569;
            --user-bubble: #2563eb;
            --agent-bubble: #1e293b;
            --success: #10b981;
            --badge-bg: #1e1b4b;
            --badge-text: #a5b4fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 1.5rem;
        }

        .badge {
            background: var(--badge-bg);
            color: var(--badge-text);
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
        }

        .user-selector {
            margin-bottom: 1.5rem;
        }

        .user-selector label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .user-selector select, .user-selector input {
            width: 100%;
            padding: 0.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .new-chat-btn {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 1rem;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: var(--accent-hover);
        }

        .session-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .session-item {
            padding: 0.6rem 0.8rem;
            background: var(--bg-card);
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-primary);
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
            transition: all 0.2s;
        }

        .session-item:hover, .session-item.active {
            border-color: var(--accent);
            background: #2d3748;
        }

        /* Chat Container */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .header .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: var(--success);
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 75%;
        }

        .message-row.user {
            align-self: flex-end;
        }

        .message-row.agent {
            align-self: flex-start;
        }

        .message-author {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.2rem;
        }

        .message-bubble {
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .message-row.user .message-bubble {
            background: var(--user-bubble);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message-row.agent .message-bubble {
            background: var(--agent-bubble);
            border: 1px solid var(--border);
            border-bottom-left-radius: 2px;
        }

        .tool-chip {
            display: inline-block;
            background: #1e1b4b;
            color: #818cf8;
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            margin-top: 0.4rem;
            border: 1px solid #3730a3;
        }

        /* Input Area */
        .input-bar {
            padding: 1rem 1.5rem;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.8rem;
        }

        .input-bar input {
            flex: 1;
            padding: 0.8rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
        }

        .input-bar input:focus {
            border-color: var(--accent);
        }

        .send-btn {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Memory Inspector Drawer */
        .inspector-panel {
            width: 320px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
        }

        .inspector-panel h2 {
            font-size: 0.95rem;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .state-block {
            background: var(--bg-card);
            border-radius: 6px;
            padding: 0.8rem;
            font-size: 0.8rem;
            font-family: monospace;
            overflow-x: auto;
            max-height: 200px;
        }
    </style>
</head>
<body>

    <!-- Left Sidebar -->
    <div class="sidebar">
        <div class="brand">
            <span>⚡ Google ADK</span>
            <span class="badge">Cloud Run</span>
        </div>

        <div class="user-selector">
            <label for="userIdInput">Active User ID (Memory Scope):</label>
            <input type="text" id="userIdInput" value="user_alice" placeholder="Enter user ID">
        </div>

        <button class="new-chat-btn" onclick="startNewSession()">+ New Conversation</button>

        <div style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.5rem;">Sessions:</div>
        <div class="session-list" id="sessionList"></div>
    </div>

    <!-- Main Chat Content -->
    <div class="main-content">
        <div class="header">
            <div>
                <h1 id="sessionTitle">Google ADK Cloud Assistant</h1>
                <span style="font-size: 0.75rem; color: var(--text-secondary);" id="sessionIdDisplay">Session ID: none</span>
            </div>
            <div class="status-indicator">
                <div class="dot"></div>
                <span>Cloud SQL Connected</span>
            </div>
        </div>

        <div class="messages-container" id="messagesContainer"></div>

        <form class="input-bar" onsubmit="sendMessage(event)">
            <input type="text" id="userInput" placeholder="Ask a question or share a preference (e.g., 'Remember that my name is Alice')..." autocomplete="off">
            <button type="submit" class="send-btn" id="sendBtn">Send</button>
        </form>
    </div>

    <!-- Right Memory Inspector Drawer -->
    <div class="inspector-panel">
        <h2>
            <span>🧠 Cloud SQL Memory</span>
            <button onclick="refreshState()" style="background:none; border:none; color:var(--accent); cursor:pointer; font-size:0.8rem;">↻</button>
        </h2>
        
        <div>
            <div style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.3rem;">User Memory (Persistent across sessions):</div>
            <pre class="state-block" id="userStateBlock">{}</pre>
        </div>

        <div>
            <div style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.3rem;">Session State (Temporary scratchpad):</div>
            <pre class="state-block" id="sessionStateBlock">{}</pre>
        </div>
    </div>

    <script>
        let currentSessionId = "session_" + Math.random().toString(36).substring(2, 9);
        let currentUserId = "user_alice";

        document.getElementById("userIdInput").addEventListener("change", (e) => {
            currentUserId = e.target.value.trim() || "user_alice";
            refreshState();
        });

        async function startNewSession() {
            currentSessionId = "session_" + Math.random().toString(36).substring(2, 9);
            document.getElementById("sessionIdDisplay").innerText = "Session ID: " + currentSessionId;
            document.getElementById("messagesContainer").innerHTML = "";
            appendMessage("agent", "Hello! Started a fresh conversation session. Your long-term user memory is preserved in Cloud SQL, while session scratchpad state is reset.");
            await fetchSessions();
            await refreshState();
        }

        function appendMessage(role, content, toolCalls = null) {
            const container = document.getElementById("messagesContainer");
            const row = document.createElement("div");
            row.className = `message-row ${role}`;

            const author = document.createElement("div");
            author.className = "message-author";
            author.innerText = role === "user" ? "You (" + currentUserId + ")" : "Google ADK Agent";

            const bubble = document.createElement("div");
            bubble.className = "message-bubble";
            bubble.innerText = content;

            row.appendChild(author);
            row.appendChild(bubble);

            if (toolCalls && toolCalls.length > 0) {
                toolCalls.forEach(tc => {
                    const chip = document.createElement("div");
                    chip.className = "tool-chip";
                    chip.innerText = `🔧 Tool: ${tc.tool}(${JSON.stringify(tc.args)})`;
                    row.appendChild(chip);
                });
            }

            container.appendChild(row);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            appendMessage("user", text);
            input.value = "";
            input.disabled = true;
            document.getElementById("sendBtn").disabled = true;

            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        session_id: currentSessionId,
                        user_id: currentUserId,
                        message: text
                    })
                });
                const data = await res.json();
                appendMessage("agent", data.response, data.tool_calls);
                await refreshState();
                await fetchSessions();
            } catch (err) {
                appendMessage("agent", "Error communicating with Cloud Run agent: " + err.message);
            } finally {
                input.disabled = false;
                document.getElementById("sendBtn").disabled = false;
                input.focus();
            }
        }

        async function refreshState() {
            try {
                const res = await fetch(`/api/sessions/${currentSessionId}/state?user_id=${currentUserId}`);
                const data = await res.json();
                
                const userMemory = {};
                const sessionMemory = {};
                
                for (const [k, v] of Object.entries(data.state || {})) {
                    if (k.startsWith("user:")) {
                        userMemory[k.replace("user:", "")] = v;
                    } else {
                        sessionMemory[k] = v;
                    }
                }

                document.getElementById("userStateBlock").innerText = JSON.stringify(userMemory, null, 2);
                document.getElementById("sessionStateBlock").innerText = JSON.stringify(sessionMemory, null, 2);
            } catch (err) {
                console.error("Failed to load state", err);
            }
        }

        async function fetchSessions() {
            try {
                const res = await fetch(`/api/sessions?user_id=${currentUserId}`);
                const data = await res.json();
                const list = document.getElementById("sessionList");
                list.innerHTML = "";
                data.sessions.forEach(s => {
                    const item = document.createElement("div");
                    item.className = `session-item ${s.session_id === currentSessionId ? 'active' : ''}`;
                    item.innerText = s.title || s.session_id;
                    item.onclick = () => switchSession(s.session_id);
                    list.appendChild(item);
                });
            } catch (err) {
                console.error("Failed to fetch sessions", err);
            }
        }

        async function switchSession(sid) {
            currentSessionId = sid;
            document.getElementById("sessionIdDisplay").innerText = "Session ID: " + currentSessionId;
            document.getElementById("messagesContainer").innerHTML = "";
            
            const res = await fetch(`/api/sessions/${sid}/events`);
            const data = await res.json();
            data.events.forEach(e => appendMessage(e.role, e.content, e.tool_calls));
            await refreshState();
            await fetchSessions();
        }

        // Initialize on load
        startNewSession();
    </script>
</body>
</html>
